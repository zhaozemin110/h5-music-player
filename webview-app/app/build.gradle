plugins {
    id 'com.android.application'
}

android {
    namespace 'com.h5player'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('h5player.jks')
            storePassword 'h5player123'
            keyPassword 'h5player123'
            keyAlias 'h5player'
        }
    }

    defaultConfig {
        applicationId "com.h5player"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {}